[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = .
asyncio_mode = auto
# api_check.py 为本地联调脚本（模块顶层直接发 HTTP 请求访问 localhost:8000），
# 不参与测试收集，避免在 CI 中因服务未启动而报连接错误
norecursedirs = .* __pycache__ .venv venv chroma_data uploads
addopts = --ignore=api_check.py
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
